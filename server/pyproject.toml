[project]
name = "warden"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Himanshu Sinha" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.7",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uuid-utils>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "warden.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres test database",
    "security: access control and attack tests",
    "slow: takes more than a few seconds",
]
