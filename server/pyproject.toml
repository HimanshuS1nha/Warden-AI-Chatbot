[project]
name = "warden"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Himanshu Sinha" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "faker>=40.54.0",
    "fastapi[standard]>=0.162.7",
    "google-genai>=3.5.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.1",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-postgres>=3.2.1",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "uuid-utils>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "warden.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic and never edited by hand after review.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use fixed demo passwords.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["src/warden"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF and python-docx annotate only part of their API.
module = ["warden.rag.parsing"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Postgres test database",
    "security: access control and attack tests",
    "slow: takes more than a few seconds",
]
