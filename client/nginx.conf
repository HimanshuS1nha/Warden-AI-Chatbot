# The client's static files, and /api proxied to the server.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Uploads through the admin API are at most 10 MB (services/uploads.py).
    client_max_body_size 12m;

    # Sent on every response, including proxied API ones. No location below
    # uses add_header, so they all inherit these.
    #
    # The CSP allows only this origin: no outside scripts, styles, fonts or
    # images, so a reply that slips a tracking image or script past the
    # markdown renderer still can't load it. Inline styles are allowed for
    # the UI library's positioning.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, not append: a client can't put its own address in front.
        # The server's per-IP rate limits and audit rows use this.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat replies stream as server-sent events.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
    }

    # Client-side routes (/login, /chat/...) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
